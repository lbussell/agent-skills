name: Sync files

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync nuget-manager directory
        uses: lbussell/sync-files@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_repo: github/awesome-copilot
          source_path: skills/nuget-manager/
